<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>周园鑫 · Stay Hungry, Stay Foolish</title>
<meta name="description" content="周园鑫的个人网站入口。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="周园鑫 · 个人网站">
<meta property="og:description" content="写代码，也写生活。这里记录我的技术、随笔与经历。">
<meta property="og:url" content="https://zhouyuanxinand.github.io/">
<meta property="og:image" content="https://zhouyuanxinand.github.io/assets/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#fafafa;
  --muted:#a7a6a6;
  --pill:#ffffff;
  --pill-ink:#050505;
  --ease:cubic-bezier(.22,1,.36,1);

  /* responsive unit system — reference canvas 1487 × 1058 */
  --u:calc(100vh / 1058);
  --uw:calc(100vw / 1487);
  --h:clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
}
@supports (height:100dvh){ :root{ --u:calc(100dvh / 1058); } }

/* ============ RESET / STAGE ============ */
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
html{ overflow:hidden; }
body{
  background:#050505;
  color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
  overflow:hidden;
}
.stage{ position:fixed; inset:0; background:#050505; }

/* ============ VIDEO PLATE ============ */
.plate{ position:absolute; inset:0; overflow:hidden; }
.plate-video{
  position:absolute;
  left:50%;
  top:calc(1 * var(--u));
  width:calc(1492 * var(--u));
  height:calc(1054 * var(--u));
  transform:translateX(calc(-50% - calc(0.5 * var(--u))));
  object-fit:cover;
  pointer-events:none;
}
.plate::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(5,5,5,0) 78.8%, rgba(5,5,5,.23) 79.6%, rgba(5,5,5,.45) 81.4%,
      rgba(5,5,5,.75) 83.3%, rgba(5,5,5,.84) 85.2%, rgba(5,5,5,.888) 88%,
      rgba(5,5,5,.905) 91%, rgba(5,5,5,.96) 95%, #050505 100%),
    linear-gradient(to right,
      #050505 calc(50% - calc(746 * var(--u))),
      transparent calc(50% - calc(676 * var(--u))),
      transparent calc(50% + calc(676 * var(--u))),
      #050505 calc(50% + calc(746 * var(--u))));
}

/* ============ PILL ============ */
.pill{
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--pill); color:var(--pill-ink);
  border-radius:999px; text-decoration:none; font-weight:500;
  transition:opacity .25s;
}
.pill:hover{ opacity:.88; }

/* ============ HERO ============ */
.headline{
  position:absolute;
  left:calc(75.5 * var(--u));
  top:calc(230.5 * var(--u));
  font-size:calc(71.6 * var(--h));
  line-height:calc(80.5 * var(--h));
  font-weight:400;
  letter-spacing:calc(.3 * var(--h));
  color:var(--ink);
  white-space:nowrap;
  z-index:2;
}
.headline span{ display:block; }

.sub{
  position:absolute;
  left:calc(75.5 * var(--u));
  top:calc(calc(230.5 * var(--u)) + calc(189 * var(--h)));
  font-size:calc(20.7 * var(--h));
  line-height:calc(23.5 * var(--h));
  font-weight:400;
  word-spacing:calc(1.8 * var(--h));
  color:var(--muted);
  z-index:2;
}
.sub span{ display:block; white-space:nowrap; }

.pill-cta{
  position:absolute;
  left:calc(74.9 * var(--u));
  top:calc(calc(230.5 * var(--u)) + calc(264.5 * var(--h)));
  width:calc(175.6 * var(--h));
  height:calc(50 * var(--h));
  font-size:calc(20.6 * var(--h));
  z-index:2;
}

/* ============ ENTRANCE ANIMATIONS ============ */
@keyframes rise{ from{ opacity:0; transform:translateY(calc(14 * var(--u))); } }

@media (prefers-reduced-motion: no-preference){
  .headline{ animation:rise .9s var(--ease) .06s both; }
  .sub{ animation:rise .9s var(--ease) .14s both; }
  .pill-cta{ animation:rise .9s var(--ease) .22s both; }
}

/* ============ PORTRAIT / MOBILE ============ */
@media (max-aspect-ratio: 11/10){
  :root{ --m:min(calc(100vw / 430), 1.34px); --u:var(--m); }

  html,body{ overflow:auto; }
  .stage{
    position:relative; inset:auto;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .plate-video{
    inset:0; left:0; top:0;
    width:100%; height:100%;
    transform:none;
    object-position:43% center;
  }
  .plate::after{
    background:
      linear-gradient(to right,
        rgba(5,5,5,.86) 0%, rgba(5,5,5,.66) 42%,
        rgba(5,5,5,.20) 78%, rgba(5,5,5,.10) 100%),
      linear-gradient(to bottom,
        rgba(5,5,5,.72) 0%, rgba(5,5,5,.34) 24%, rgba(5,5,5,.34) 56%,
        rgba(5,5,5,.80) 82%, rgba(5,5,5,.97) 94%, #050505 100%);
  }

  .hero{
    position:relative; z-index:2;
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:calc(40 * var(--u)) calc(24 * var(--u));
  }
  .headline{
    position:relative; left:auto; top:auto;
    white-space:normal;
    font-size:calc(52 * var(--u));
    line-height:1.14;
    letter-spacing:calc(.3 * var(--u));
  }
  .headline span{ display:inline; }
  .sub{
    position:relative; left:auto; top:auto;
    margin-top:calc(18 * var(--u));
    font-size:calc(16.5 * var(--u));
    line-height:1.5;
    word-spacing:normal;
  }
  .sub span{ display:inline; white-space:normal; }
  .pill-cta{
    position:relative; left:auto; top:auto;
    width:auto; height:auto; align-self:flex-start;
    margin-top:calc(30 * var(--u));
    padding:calc(14 * var(--u)) calc(30 * var(--u));
    font-size:calc(15.5 * var(--u));
  }
}
/* tablet band */
@media (min-width:600px) and (max-aspect-ratio: 11/10){
  :root{ --m:min(calc(100vw / 860), calc(100vh / 760), 1.25px); --u:var(--m); }
  .plate-video{ object-position:44% center; }
  .plate::after{
    background:
      linear-gradient(to right,
        rgba(5,5,5,.84) 0%, rgba(5,5,5,.60) 42%,
        rgba(5,5,5,.16) 78%, rgba(5,5,5,.06) 100%),
      linear-gradient(to bottom,
        rgba(5,5,5,.66) 0%, rgba(5,5,5,.28) 24%, rgba(5,5,5,.30) 56%,
        rgba(5,5,5,.78) 82%, rgba(5,5,5,.96) 94%, #050505 100%);
  }
  .headline span{ display:block; }
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="plate">
    <video class="plate-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
    </video>
  </div>

  <main class="hero">
    <h1 class="headline"><span>Stay hungry.</span><span>Stay foolish.</span></h1>
    <p class="sub"><span>Writing code, chasing ideas — exploring how systems learn,</span><span>scale, and quietly shape the world we live in.</span></p>
    <a class="pill pill-cta" href="home.html"><span>Get Started</span></a>
  </main>

</div>
</body>
</html>
