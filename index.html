<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>周园鑫 · Stay Hungry, Stay Foolish</title>
<meta name="description" content="周园鑫的个人网站入口。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="周园鑫 · 个人网站">
<meta property="og:description" content="写代码，也写生活。这里记录我的技术、随笔与经历。">
<meta property="og:url" content="https://zhouyuanxinand.github.io/">
<meta property="og:image" content="https://zhouyuanxinand.github.io/assets/og-image.png">
<link rel="prefetch" href="home.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ 编辑宣言风 · 米色纸面 + 大衬线 + 橙红点缀 ============ */
:root{
  --paper:#f4efe6;
  --ink:#17140f;
  --muted:#6e6659;
  --accent:#e14e1f;
  --rule:rgba(23,20,15,0.16);
  --serif:"Playfair Display","Noto Serif SC",serif;
  --cserif:"Noto Serif SC",serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
  overflow:hidden;
}
.stage{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  transition:opacity 2.6s ease;
}
.stage.leaving{ opacity:0; pointer-events:none; }

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 44px;
  border-bottom:1px solid var(--rule);
}
.logo{ font-family:var(--sans); font-weight:700; font-size:19px; letter-spacing:0.04em; color:var(--ink); text-decoration:none; }
.top-enter{
  font-size:14px; color:var(--ink); text-decoration:none;
  display:inline-flex; align-items:center; gap:6px;
  transition:color .2s;
}
.top-enter:hover{ color:var(--accent); }

/* ---------- 主视觉 ---------- */
.hero{
  flex:1; display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);
  align-items:center;
  gap:40px;
  padding:0 44px;
  max-width:1440px; width:100%; margin:0 auto;
}
.hero-left{ min-width:0; }
.hero-label{
  font-size:13.5px; color:var(--accent); font-weight:500;
  letter-spacing:0.06em; margin-bottom:26px;
}
.hero h1{
  font-family:var(--serif);
  font-size:clamp(56px, 7.2vw, 118px);
  font-weight:500;
  line-height:1.06;
  letter-spacing:-0.01em;
  color:var(--ink);
}
.hero h1 .l2{ display:block; font-style:italic; }
.hero-rule{ height:1px; background:var(--rule); margin:34px 0 26px; max-width:520px; }
.hero-stats{ display:flex; gap:34px; }
.hero-stats b{
  font-family:var(--cserif); font-weight:900; font-size:26px;
  color:var(--accent); margin-right:6px;
}
.hero-stats span{ font-size:13px; color:var(--muted); }
.hero-stats > div{ display:flex; align-items:baseline; }

/* 右侧大字「鑫」 */
.hero-mark{
  font-family:var(--cserif); font-weight:900;
  font-size:clamp(220px, 30vw, 420px);
  line-height:1; color:var(--accent);
  text-align:center;
  user-select:none;
}

/* ---------- 底部编号链接 ---------- */
.bottom-links{
  display:grid; grid-template-columns:1fr 1fr 1fr;
  border-top:1px solid var(--rule);
}
.bottom-links a{
  display:flex; align-items:baseline; gap:18px;
  padding:26px 44px;
  color:var(--ink); text-decoration:none;
  border-right:1px solid var(--rule);
  transition:background .2s;
}
.bottom-links a:last-child{ border-right:none; }
.bottom-links a:hover{ background:rgba(225,78,31,0.05); }
.bottom-links .num{
  font-family:var(--serif); font-size:26px; font-weight:600;
  color:var(--accent); font-style:italic;
}
.bottom-links .name{ font-size:17px; font-weight:500; }
.bottom-links .arrow{ margin-left:auto; color:var(--accent); font-size:18px; }

/* ---------- 入场动画 ---------- */
@keyframes rise{ from{ opacity:0; transform:translateY(22px); } }
@media (prefers-reduced-motion: no-preference){
  .topbar{ animation:rise .7s var(--ease) both; }
  .hero-label{ animation:rise .8s var(--ease) .08s both; }
  .hero h1{ animation:rise .9s var(--ease) .16s both; }
  .hero-rule,.hero-stats{ animation:rise .9s var(--ease) .26s both; }
  .hero-mark{ animation:rise 1s var(--ease) .22s both; }
  .bottom-links{ animation:rise .8s var(--ease) .34s both; }
}

/* ---------- 移动端 ---------- */
@media (max-width: 760px){
  body{ overflow:auto; }
  .stage{ position:relative; min-height:100vh; min-height:100dvh; }
  .topbar{ padding:20px 22px; }
  .hero{ grid-template-columns:1fr; gap:8px; padding:36px 22px; align-content:start; }
  .hero-mark{ font-size:150px; text-align:left; order:2; margin-top:12px; }
  .hero-stats{ flex-wrap:wrap; gap:18px; }
  .bottom-links{ grid-template-columns:1fr; }
  .bottom-links a{ border-right:none; border-bottom:1px solid var(--rule); padding:20px 22px; }
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <header class="topbar">
    <a class="logo" href="home.html">周园鑫</a>
    <a class="top-enter" href="home.html">进入主页 →</a>
  </header>

  <main class="hero">
    <div class="hero-left">
      <p class="hero-label">后端开发 / AI 应用 / 持续写作</p>
      <h1><span class="l1">Stay hungry.</span><span class="l2">Stay foolish.</span></h1>
      <div class="hero-rule"></div>
      <div class="hero-stats">
        <div><b>4</b><span>段实习</span></div>
        <div><b>2</b><span>次创业</span></div>
        <div><b>14 章</b><span>技术教材</span></div>
      </div>
    </div>
    <div class="hero-mark" aria-hidden="true">鑫</div>
  </main>

  <nav class="bottom-links">
    <a href="home.html"><span class="num">01</span><span class="name">进入主页</span><span class="arrow">→</span></a>
    <a href="posts.html"><span class="num">02</span><span class="name">阅读随笔</span><span class="arrow">→</span></a>
    <a href="assets/resume.pdf" target="_blank" rel="noopener"><span class="num">03</span><span class="name">下载简历</span><span class="arrow">↓</span></a>
  </nav>

</div>

<script>
// 停留一段时间后渐进淡出，自动进入主页（视频已移除，按时间驱动）
(function () {
  var HOLD_MS = 9000;   // 停留时长
  var FADE_MS = 2800;   // 淡出时长
  setTimeout(function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.body.style.background = dark ? "#101418" : "#fafaf7";
    document.getElementById("stage").classList.add("leaving");
    setTimeout(function () { window.location.href = "home.html"; }, FADE_MS);
  }, HOLD_MS);
})();
</script>
</body>
</html>
